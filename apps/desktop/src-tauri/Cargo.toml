[package]
name = "divisio"
version = "0.0.0"
description = "Divisio — local command center for coding agents"
authors = ["Divisio"]
edition = "2021"

[lib]
name = "divisio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
